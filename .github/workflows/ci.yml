name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # CI-only placeholders. Auth fails closed in real deployments unless the
  # host supplies real values; the smoke test generates its own temporary env.
  AUTH_SECRET: ci-only-auth-secret-not-for-production
  AUTH_GITHUB_ID: ci-only-client-id
  AUTH_GITHUB_SECRET: ci-only-client-secret
  AUTH_TRUST_HOST: "1"
  AUTH_URL: http://127.0.0.1:3000
  GITHUB_ADMIN_ID: "1"
  GITHUB_REPO_OWNER: ci-only-owner
  SITE_URL: http://127.0.0.1:3000
  TRUST_PROXY: ""
  TRUST_PROXY_HOPS: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the current v4 commit; update deliberately after reviewing changes.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build and smoke test
        run: npm run verify

      - name: Verify backup script
        run: node scripts/backup-db.mjs .data/ci-backup.sqlite
